# The remote agent is a fully static Linux binary. Rust ships the musl libc and
# its own linker, so these targets cross-compile from macOS or Linux with only
# `rustup target add <target>`; no C toolchain needed.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
