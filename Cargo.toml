[workspace]
resolver = "2"
members = ["crates/proto", "crates/agent", "crates/client", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xju2/yonder"

[workspace.dependencies]
yonder-proto = { path = "crates/proto" }
yonder-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# The agent is uploaded over ssh on first connect, so keep it small.
[profile.release.package.yonder-agent]
opt-level = "s"
