<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yonder</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section id="connect-view">
      <form id="connect-form" class="card">
        <h1>Yonder</h1>
        <label>Host <input id="host" placeholder="perlmutter" autocomplete="off" spellcheck="false" required /></label>
        <label>Folder <input id="folder" placeholder="~/project" autocomplete="off" spellcheck="false" /></label>
        <button id="connect-btn" type="submit">Connect</button>
        <button id="connect-cancel" type="button" hidden>Back to the open workspace</button>
        <div id="recent"></div>
        <div id="connect-error" hidden></div>
        <ol id="connect-log"></ol>
      </form>
    </section>

    <section id="workspace" hidden>
      <aside id="sidebar">
        <nav id="side-tabs" role="tablist">
          <button role="tab" id="tab-files" data-view="files" aria-controls="files-view" aria-selected="true">Files</button>
          <button role="tab" id="tab-changes" data-view="changes" aria-controls="changes-view" aria-selected="false" tabindex="-1">Changes</button>
          <button role="tab" id="tab-history" data-view="history" aria-controls="history-view" aria-selected="false" tabindex="-1">History</button>
          <button role="tab" id="tab-search" data-view="search" aria-controls="search-view" aria-selected="false" tabindex="-1">Search</button>
        </nav>
        <section id="files-view" class="side-view" role="tabpanel" aria-labelledby="tab-files">
          <header>
            <span id="root-name"></span>
            <button id="refresh-tree" title="Refresh the file tree" aria-label="Refresh the file tree">↻</button>
          </header>
          <div id="tree"></div>
        </section>
        <section id="changes-view" class="side-view" role="tabpanel" aria-labelledby="tab-changes" hidden></section>
        <section id="history-view" class="side-view" role="tabpanel" aria-labelledby="tab-history" hidden></section>
        <section id="search-view" class="side-view" role="tabpanel" aria-labelledby="tab-search" hidden></section>
      </aside>
      <div id="sash"></div>
      <main id="main">
        <nav id="tabs"></nav>
        <div id="banner" hidden></div>
        <div id="content">
          <div id="editor"></div>
          <div id="viewer" hidden></div>
          <div id="diff" hidden></div>
          <div id="placeholder">Open a file from the tree.</div>
        </div>
        <div id="panel-sash" hidden></div>
        <section id="terminal-panel" hidden>
          <header>
            <nav id="term-tabs"></nav>
            <button id="term-new" title="New terminal" aria-label="New terminal">+</button>
            <button id="term-hide" title="Hide terminals (Ctrl+`)" aria-label="Hide terminals">⌄</button>
          </header>
          <div id="term-body"></div>
        </section>
      </main>
      <footer id="status">
        <button id="toggle-sidebar" title="Show or hide the sidebar (⌘B)" aria-label="Show or hide the sidebar">◧</button>
        <button id="status-conn" title="Switch workspace (⌥⌘O)"></button>
        <span id="status-msg"></span>
        <span id="status-pos"></span>
        <button id="toggle-terminal" title="Show or hide terminals (Ctrl+`)">Terminal</button>
      </footer>
    </section>

    <dialog id="finder" aria-label="Go to file">
      <input id="finder-input" placeholder="Go to file…" aria-controls="finder-list" autocomplete="off" spellcheck="false" />
      <ul id="finder-list" role="listbox"></ul>
    </dialog>

    <dialog id="modal">
      <form method="dialog">
        <p id="modal-text"></p>
        <pre id="modal-detail" hidden></pre>
        <input id="modal-input" aria-labelledby="modal-text" aria-describedby="modal-detail" autocomplete="off" spellcheck="false" hidden />
        <menu id="modal-buttons"></menu>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
